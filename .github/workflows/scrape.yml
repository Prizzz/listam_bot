name: scrape-listam
# Real browser on a GitHub runner (an IP Cloudflare accepts) -> snapshot -> the Hugging Face Space.
on:
  schedule:
    - cron: "*/5 * * * *"  # the shortest interval GitHub allows; runs may be delayed under load
  workflow_dispatch:
    inputs:
      browser:
        description: "chromium (Playwright build) or chrome (the runner's Chrome)"
        default: "chromium"
concurrency:
  group: scrape-listam
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/scrape-requirements.txt
      - run: pip install -r scripts/scrape-requirements.txt
      - name: Cache Playwright browsers
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.60.0-${{ runner.os }}
      - name: Install Chromium (the runner image already has the system libraries it needs)
        if: ${{ (github.event.inputs.browser || 'chromium') == 'chromium' }}
        run: playwright install chromium
      - name: Scrape list.am and push to the Space
        env:
          BROWSER: ${{ github.event.inputs.browser || 'chromium' }}
          SPACE_URL: ${{ vars.SPACE_URL }}
          MAX_PRICE: ${{ vars.MAX_PRICE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
        run: xvfb-run -a --server-args="-screen 0 1366x850x24" python scripts/gh_scrape.py
