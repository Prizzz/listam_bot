services:
  listam:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/listam.db
      LISTAM_FETCHER: http
    volumes:
      - ./data:/data
    mem_limit: 512m   # same ceiling as the smallest Render plan
    cpus: 0.5
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
