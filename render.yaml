# Render Blueprint: one FREE web service built from the light Dockerfile (no browser).
#
# A free web service must listen on $PORT (the bot serves /health there) and is put to sleep after
# 15 minutes without inbound traffic. Point an external pinger (UptimeRobot etc.) at
#   https://<service>.onrender.com/health   every ~5 minutes
# to keep it awake. There is no persistent disk: the SQLite DB lives on the instance filesystem and is
# wiped on every restart/deploy; the bot then silently re-saves a baseline and only misses ads that
# appeared in between.
services:
  - type: web
    name: listam
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt        # closest to Armenia
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false          # enter in the Render dashboard, never commit it
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: LISTAM_FETCHER
        value: http
      - key: BANALI
        value: "1"
      - key: EPHEMERAL_STATE
        value: "1"
      - key: MAX_PRICE
        value: "220000"      # /maxprice resets on restart; change it here to make it permanent
      - key: POLL_INTERVAL
        value: "180"
      # Uncomment if list.am answers "blocked after 6 attempts" from Render's IPs:
      # - key: PROXY_URL
      #   sync: false
