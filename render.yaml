# Render Blueprint: the bot as a FREE web service (no browser needed).
#
# list.am is scraped by a GitHub Actions runner (a real browser from an IP Cloudflare accepts), which
# POSTs snapshots to this service's /ingest every few minutes; that traffic also keeps the free service
# from sleeping (it sleeps after 15 min without inbound traffic). An external pinger on /health is a
# good backup. banali.am is fetched directly (plain JSON API).
# There is no persistent disk: the SQLite DB lives on the instance and is wiped on every restart/deploy;
# the bot then silently re-saves a baseline and only misses ads that appeared in between.
services:
  - type: web
    name: listam
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt        # closest to Armenia
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false          # enter in the Render dashboard, never commit it
      - key: ALLOWED_CHAT_IDS
        sync: false
      - key: INGEST_KEY
        sync: false          # the same value as the INGEST_KEY secret in GitHub Actions
      - key: LISTAM_FETCHER
        value: snapshot      # list.am data comes from the GitHub runner
      - key: BANALI
        value: "1"
      - key: EPHEMERAL_STATE
        value: "1"
      - key: MAX_PRICE
        value: "220000"      # /maxprice resets on restart; change it here (and in GitHub) to keep it
      - key: POLL_INTERVAL
        value: "180"
